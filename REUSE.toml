# Theme file copied from Hextra v0.13.0 and modified (MIT)
[[annotations]]
path = "layouts/_partials/shortcodes/card.html"
precedence = "override"
SPDX-FileCopyrightText = ["2023 Xin (Hextra)", "2026 Norca contributors"]
SPDX-License-Identifier = "MIT"

# Pages adapted from the Nomad Pack v0.4.2 documentation (MPL 2.0); each names
